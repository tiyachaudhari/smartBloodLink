[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*
addopts = -ra --html=reports/report.html --self-contained-html --strict-markers
# Silences the globally installed pytest-asyncio plugin (this suite is sync).
asyncio_default_fixture_loop_scope = function
markers =
    smoke: fast sanity checks (site availability / home screen)
    navigation: tab and screen navigation checks
    auth: demo login / logout / role shortcut checks
    donor: donor portal workflows
    search: blood bank map and filter checks
    request: blood request form checks
    hospital: hospital / ambulance / admin portal checks
    read_only: test never submits or mutates application data
